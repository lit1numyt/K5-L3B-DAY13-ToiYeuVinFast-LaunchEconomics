# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm (co_mau(0.70, 0.75) trong src/lab13.py)
#   b) Theo nhân viên, m = 75: DE = 1 + 74 × 0,02 = 2,48; 3.103 mỗi nhóm = 42 người mỗi nhóm, tổng 84 > 40 nhân viên: không đủ người
#   c) 20 nhân viên mỗi nhóm: tối đa c / ICC = 20 / 0,02 = 1.000 < 1.251: không đạt mức 5 điểm dù m lớn bao nhiêu
#   d) 6 depot mỗi nhóm: tối đa 6 / 0,02 = 300, và chỉ 6 cụm: loại
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: 20m / (1 + (m − 1) × 0,02) ≥ 859 → m ≥ 299 yêu cầu mỗi người, DE 6,96
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: có, 20 nhân viên đối chứng làm cùng tuần, cùng depot, cùng loại yêu cầu
#   2. Chia ngẫu nhiên hay do người chọn: bốc thăm bằng code, seed ghi trước, phân tầng theo depot
#   3. Ảnh hưởng gián tiếp và cách giảm: nhân viên cùng depot có thể chia sẻ câu trả lời; khoá trợ lý theo tài khoản, log agent_suggestion_shown theo staff_id
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: có, chốt trong file này trước ngày bắt đầu 2026-12-07
#   5. Ít nhất 20 cụm mỗi nhóm: có, đúng 20 nhân viên mỗi nhóm
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Với 40 nhân viên, không cách chia theo cụm nào thấy được mức chênh 5 điểm. Nhóm chọn chia theo nhân viên và nâng mde lên 6 điểm.
#   Nếu tác động thật chỉ 5 điểm, power chỉ còn 0,64 (NormalIndPower, n = 859). Cần Giám đốc vận hành ký chấp nhận trước ngày bắt đầu.
#   Mỗi nhân viên cần ≥ 299 yêu cầu trong phạm vi: khoảng 37,5 yêu cầu/người/ngày × 82% trong phạm vi ≈ 30/ngày → ~10 ngày làm việc ở bước 0.50.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Hiện tại 4,25% (51/1.200); trong phạm vi noi_dia + hang_nang 3,97%. Ngưỡng tuyệt đối 3% sẽ dừng pilot ngay tuần đầu,
#   nên dùng chênh so với đối chứng ≥ 2 điểm, kèm trần tuyệt đối 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang ở cả 12 depot (0,22× và 0,69× so với 12.000 đ, simulated); loại quoc_te (1,88×, thành công 27,3%) và doi_tac (0,85×, thành công 54,4%), simulated"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # 4 → 10 → 20 nhân viên; bước 0.10 (từ 07/12) và 0.25 (từ 14/12) mỗi bước một tuần
  # Bước 0.50 bắt đầu 21/12 và không giới hạn một tuần: chạy đến khi mỗi nhân viên đủ 299 yêu cầu trong phạm vi
  # (khoảng 10 ngày làm việc, dự kiến đến 04/01/2027, đã trừ ngày nghỉ 01/01), rồi theo dõi đủ 7 ngày mở lại → 11/01/2027.
  # Thiếu mẫu thì kéo dài bước 0.50; ngày quyết định = ngày người cuối cùng đủ 299 yêu cầu + 7 ngày, Giám đốc vận hành công bố.
  # Chỉ đo chỉ số chính ở bước 0.50; trong thời gian kéo dài chỉ xem chỉ số an toàn.
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi đã chấp nhận, xem chú thích đầu file
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "20 nhân viên đối chứng làm cùng tuần, cùng depot, cùng phạm vi noi_dia + hang_nang"
    spillover_risk: "Trung bình: nhân viên cùng depot chia sẻ câu trả lời; giảm bằng khoá trợ lý theo tài khoản và đếm agent_suggestion_shown theo staff_id ở nhóm đối chứng (phải bằng 0)"
    predeclared: "Chỉ số chính, mde 0,06, luật dừng và ngày quyết định chốt trong file này trước 2026-12-07"
  stop_rules:
    - "NẾU tỉ lệ mở lại 7 ngày của nhóm trợ lý cao hơn đối chứng từ 2 điểm hoặc vượt 6% TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút và chuyển toàn bộ về nhân viên tự làm KHÔNG THÌ không được sang bước rollout tiếp theo"
    - "NẾU đối soát sổ cái phát hiện từ 1 ca hoàn trùng (hai refund_ledger_write ok cho cùng request_id) TRONG 1 lần đối soát mỗi giờ, không chờ cửa sổ 3 ngày, THÌ dừng gửi tiền tự động ngay, Giám đốc vận hành tắt trợ lý trong 30 phút và Kỹ sư trưởng agent tìm nguyên nhân, thu hồi khoản trùng trước khi bật lại KHÔNG THÌ tiếp tục đối soát mỗi giờ"
    - "NẾU chi phí mỗi việc thành công trong phạm vi, gồm chi phí cố định, vượt 6.000 đ (hiện 4.599 đ, simulated) TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp về noi_dia và giới hạn 2 lần chạy KHÔNG THÌ không được mở thêm hang_nang hay depot"
    - "NẾU tỉ lệ bỏ qua gợi ý (sửa + bỏ) vượt 40% (đợt chạy thử 27,12%) TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày và báo PM KHÔNG THÌ không được chuyển bước rollout"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bật cờ tắt trợ lý, hiệu lực trong 30 phút; khách được phục vụ bằng luồng nhân viên tự làm như hiện nay; ticket đang mở chuyển cho nhân viên kèm tóm tắt"
  decision_date: "2027-01-11"
  simulated_inputs:
    - "phut_xem_lai_simulated, phut_lam_lai_simulated (logix_requests.csv)"
    - "Chi phí mỗi việc thành công theo loại A3: noi_dia 2.696 đ, hang_nang 8.221 đ, quoc_te 22.515 đ, doi_tac 10.215 đ"
    - "Chi phí trong phạm vi gồm cố định 4.599 đ/việc ở 45.000 yêu cầu/tháng (A4)"
    - "Ngưỡng chi phí 6.000 đ trong luật dừng 3 (luật chi phí)"
